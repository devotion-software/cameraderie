name: Cameraderie
options:
  bundleIdPrefix: dev.joeherbert
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:
  Cameraderie:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Cameraderie
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: "Cameraderie needs access to your photo library so you can select and upload photos and videos to share with your groups."
        NSPhotoLibraryAddUsageDescription: "Cameraderie can save downloaded originals back to your photo library."
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joeherbert.cameraderie
        PRODUCT_NAME: Cameraderie
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

schemes:
  Cameraderie:
    build:
      targets:
        Cameraderie: all
    run:
      config: Debug
    archive:
      config: Release
