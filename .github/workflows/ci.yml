name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build shared + db (needed for type resolution)
        run: |
          bun run --filter='@cameraderie/shared' build
          bun run --filter='@cameraderie/db' build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build all
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f packages/api/Dockerfile -t cameraderie-api .
      - name: Build worker image
        run: docker build -f packages/worker/Dockerfile -t cameraderie-worker .
