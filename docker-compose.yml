# Cameraderie — single-box stack for the Hetzner CX23.
# The API, worker, and web run here; originals + derivatives live in Cloudflare R2.
# Copy .env.example to .env and fill in R2 + secrets before `docker compose up`.

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cameraderie}
      MARIADB_USER: ${MARIADB_USER:-cameraderie}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-cameraderie}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # Enable persistence so queued jobs survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Local S3 (dev only) ──────────────────────────────────────────────
  # Stand-in for Cloudflare R2 when developing. R2 is S3-compatible, so the
  # app talks to this with no code change — just point R2_ENDPOINT at it
  # (http://localhost:9000) and use the minioadmin creds. See .env.example.
  # NOTE: originals still live in real R2 in production; this is dev scaffolding.
  minio:
    image: minio/minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000' # S3 API — presigned upload/download URLs hit this
      - '9001:9001' # web console (http://localhost:9001)

  # One-shot: create the bucket and set CORS so the browser can read the
  # ETag header after each multipart PUT (the resumable-upload path needs it,
  # same reason real R2 needs ExposeHeaders: ETag). Exits once done.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 \
          "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"; do
          echo 'waiting for minio...'; sleep 1;
        done
        mc mb -p "local/${R2_BUCKET:-cameraderie}"
        mc anonymous set none "local/${R2_BUCKET:-cameraderie}"
        cat > /tmp/cors.json <<'JSON'
        {"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","POST","DELETE","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"]}]}
        JSON
        mc cors set "local/${R2_BUCKET:-cameraderie}" /tmp/cors.json || \
          echo 'cors set skipped (older mc); MinIO exposes ETag by default'
        echo 'minio bucket ready'

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      API_PORT: 3000
      DATABASE_URL: mysql://${MARIADB_USER:-cameraderie}:${MARIADB_PASSWORD:-cameraderie}@mariadb:3306/${MARIADB_DATABASE:-cameraderie}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PRESIGN_TTL_SECONDS: ${R2_PRESIGN_TTL_SECONDS:-900}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_MAX: ${STRIPE_PRICE_MAX:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MARIADB_USER:-cameraderie}:${MARIADB_PASSWORD:-cameraderie}@mariadb:3306/${MARIADB_DATABASE:-cameraderie}
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BLOCKED_SHA256: ${BLOCKED_SHA256:-}
    healthcheck:
      # Liveness: the heartbeat file must have been touched within ~90s.
      test:
        - CMD
        - bun
        - -e
        - "const fs=require('fs');const t=+fs.readFileSync('/tmp/worker-heartbeat','utf8');process.exit(Date.now()-t<90000?0:1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The browser talks to the API directly, so this must be host-reachable.
      PUBLIC_API_URL: ${API_URL:-http://localhost:3000}
      PORT: 5173
    ports:
      - '5173:5173'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mariadb-data:
  redis-data:
  minio-data:
