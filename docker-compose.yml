# Cameraderie — single-box stack for the Hetzner CX23.
# The API, worker, and web run here; originals + derivatives live in Cloudflare R2.
# Copy .env.example to .env and fill in R2 + secrets before `docker compose up`.

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cameraderie}
      MARIADB_USER: ${MARIADB_USER:-cameraderie}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-cameraderie}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # Enable persistence so queued jobs survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Local S3 (dev only) ──────────────────────────────────────────────
  # Stand-in for Cloudflare R2 when developing. R2 is S3-compatible, so the
  # app talks to this with no code change — just point R2_ENDPOINT at it
  # (http://localhost:3900) and use the GARAGE_* creds. See .env.example.
  # NOTE: originals still live in real R2 in production; this is dev scaffolding.
  # (We use Garage, not MinIO — MinIO's Docker images now require a login to
  # even pull. Garage is Apache-2.0, no account needed. Config: deploy/garage.toml.)
  garage:
    # dxflrs/garage ships distroless (no shell), so we can't run a bootstrap
    # entrypoint inside it directly — deploy/garage/Dockerfile repackages the
    # same binary onto a minimal shell-having base for that purpose.
    build:
      context: ./deploy/garage
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      GARAGE_DEFAULT_BUCKET: ${R2_BUCKET:-cameraderie}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-data:/data
    ports:
      - '3900:3900' # S3 API — presigned upload/download URLs hit this
      - '3903:3903' # admin API (health/bucket/key management)

  # One-shot: set CORS so the browser can read the ETag header after each
  # multipart PUT (the resumable-upload path needs it, same reason real R2
  # needs ExposeHeaders: ETag). The bucket + key themselves are created by
  # the `garage` service's entrypoint script on first boot. Exits once done.
  garage-init:
    image: amazon/aws-cli
    depends_on:
      - garage
    environment:
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      AWS_DEFAULT_REGION: auto
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until aws --endpoint-url http://garage:3900 s3 ls >/dev/null 2>&1; do
          echo 'waiting for garage...'; sleep 1;
        done
        cat > /tmp/cors.json <<'JSON'
        {"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","POST","DELETE","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"]}]}
        JSON
        aws --endpoint-url http://garage:3900 s3api put-bucket-cors \
          --bucket "${R2_BUCKET:-cameraderie}" --cors-configuration file:///tmp/cors.json
        echo 'garage bucket CORS set'

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      API_PORT: 3000
      DATABASE_URL: mysql://${MARIADB_USER:-cameraderie}:${MARIADB_PASSWORD:-cameraderie}@mariadb:3306/${MARIADB_DATABASE:-cameraderie}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PRESIGN_TTL_SECONDS: ${R2_PRESIGN_TTL_SECONDS:-900}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_MAX: ${STRIPE_PRICE_MAX:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MARIADB_USER:-cameraderie}:${MARIADB_PASSWORD:-cameraderie}@mariadb:3306/${MARIADB_DATABASE:-cameraderie}
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BLOCKED_SHA256: ${BLOCKED_SHA256:-}
    healthcheck:
      # Liveness: the heartbeat file must have been touched within ~90s.
      test:
        - CMD
        - bun
        - -e
        - "const fs=require('fs');const t=+fs.readFileSync('/tmp/worker-heartbeat','utf8');process.exit(Date.now()-t<90000?0:1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The browser talks to the API directly, so this must be host-reachable.
      PUBLIC_API_URL: ${API_URL:-http://localhost:3000}
      PORT: 5173
    ports:
      - '5173:5173'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mariadb-data:
  redis-data:
  garage-data:
